name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --coverage

      - name: Build
        run: npm run build

      # Advisory (no bloqueante): quedan vulnerabilidades transitivas
      # cuya unica via de fix es un major breaking (postcss -> Next 16).
      # Un gate eternamente rojo entrena a ignorar el CI; los gates duros
      # (lint, tipos, tests, build) siguen bloqueando el merge.
      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true
